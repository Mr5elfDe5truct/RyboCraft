[package]
name = "rybocraft-setup"
description = "RyboCraft's Windows installer and uninstaller"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui = { workspace = true }
image = { workspace = true }
zip = { workspace = true }
rfd = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

[build-dependencies]
zip = { workspace = true }
embed-resource = "3.0.11"
