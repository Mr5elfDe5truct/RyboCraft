[package]
name = "rybocore-convert"
description = "The one conversion between rybocore-record's plain data and the kernel's values: field copies, no geometry"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false
# rybocore-record needs Rust 1.88 (edition 2024 let chains).
rust-version = "1.88"
repository = "https://github.com/Mr5elfDe5truct/RyboCraft"
keywords = ["cad", "brep", "nurbs", "geometry"]
categories = ["data-structures", "science"]

# Layers §3: the conversion sits on the record and the kernel only; the modelling layer and the
# mesher both use it.
[dependencies]
rybocore = { path = "../rybocore" }
rybocore-record = { path = "../rybocore-record" }

[dev-dependencies]
flate2 = "1.1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
